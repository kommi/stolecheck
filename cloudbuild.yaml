# Cloud Build configuration for StoleCheck
# Automatically builds and deploys on Git push

steps:
  # Step 1: Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stolecheck-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stolecheck-backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 2: Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stolecheck-backend'

  # Step 3: Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-backend'
    args:
      - 'run'
      - '--filename=.'
      - '--image=stolecheck-backend=gcr.io/$PROJECT_ID/stolecheck-backend:$COMMIT_SHA'
      - '--location=us-central1-c'
      - '--cluster=stolecheck-prod'

  # Step 4: Deploy to Cloud Run (alternative if not using GKE)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-backend-cloudrun'
    args:
      - 'run'
      - 'deploy'
      - 'stolecheck-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/stolecheck-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # Step 5: Build frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stolecheck-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stolecheck-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '.'

  # Step 6: Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stolecheck-frontend'

  # Step 7: Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-frontend-cloudrun'
    args:
      - 'run'
      - 'deploy'
      - 'stolecheck-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/stolecheck-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # Step 8: Run tests (optional)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'run-tests'
    args:
      - 'run'
      - '--rm'
      - 'gcr.io/$PROJECT_ID/stolecheck-backend:$COMMIT_SHA'
      - 'python'
      - '-m'
      - 'pytest'
      - 'tests/'

# Images to be pushed to registry
images:
  - 'gcr.io/$PROJECT_ID/stolecheck-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/stolecheck-backend:latest'
  - 'gcr.io/$PROJECT_ID/stolecheck-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/stolecheck-frontend:latest'

# Configuration
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Build timeout
timeout: '3600s'

# Substitution variables
substitutions:
  _REGION: 'us-central1'
  _BACKEND_SERVICE: 'stolecheck-backend'
  _FRONTEND_SERVICE: 'stolecheck-frontend'
